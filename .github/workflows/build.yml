name: Build PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false

      - name: Rename PDF
        run: cp build/main.pdf build/matstat_lecture_notes_2026.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: matstat-notes
          path: build/matstat_lecture_notes_2026.pdf

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Свежая версия конспекта
          prerelease: true
          make_latest: true
          files: build/matstat_lecture_notes_2026.pdf
